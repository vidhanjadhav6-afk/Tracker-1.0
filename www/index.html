<style>
:root{--bg:#F8FAFC;--card:#fff;--ink:#111827;--mute:#6B7280;--line:#E5E7EB;--tab:#CBD5E1;--tabtxt:#fff;
--train:#16A34A;--cricket:#EA580C;--pv:#2563EB;--college:#7C3AED;--rest:#64748B;--free:#0D9488;--gold:#D97706}
@media(prefers-color-scheme:dark){:root{--bg:#0B1120;--card:#151E2E;--ink:#F1F5F9;--mute:#94A3B8;--line:#243044;--tab:#334155;--tabtxt:#0B1120}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:480px;margin:0 auto;padding:14px 16px 96px}
.top{margin-bottom:14px;display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.04em}
.top span:last-child{color:var(--mute);font-weight:600}
nav{display:flex;gap:6px;margin:12px 0 16px;position:sticky;top:0;padding:6px 0;background:var(--bg);z-index:5}
nav button{flex:1;border:1px solid var(--tab);background:var(--card);color:var(--ink);border-radius:20px;padding:9px 0;font:700 11px system-ui;letter-spacing:.03em}
nav button.on{background:var(--ink);color:var(--tabtxt);border-color:var(--ink)}
h1{font-size:24px;margin:0}.sub{color:var(--mute);font-size:12px;margin:2px 0 14px}
.sec{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mute);margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 18px;margin-bottom:8px;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--rest))}
.t{font-size:11px;font-weight:700;color:var(--c)}.n{font-size:16px;font-weight:700;margin:1px 0 2px}.d{font-size:13px;color:var(--mute)}
.card.past{opacity:.45}
.card.now{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.badge{position:absolute;right:12px;top:12px;font-size:10px;font-weight:800;color:#fff;background:var(--c);border-radius:10px;padding:2px 8px}
.hero{background:var(--c,var(--pv));color:#fff;border-radius:16px;padding:16px;margin-bottom:14px}
.hero .k{font-size:11px;font-weight:700;letter-spacing:.06em;opacity:.85}
.hero .n{font-size:22px;margin:4px 0}.hero .d{color:#fff;opacity:.9}
.bar{height:6px;background:rgba(255,255,255,.3);border-radius:3px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:3px}
.meta{display:flex;justify-content:space-between;font-size:12px;margin-top:6px;opacity:.95}
.chk{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-weight:700;width:100%;color:var(--ink);text-align:left;font-size:14px}
.box{width:24px;height:24px;border-radius:50%;border:2px solid var(--c);flex:none;display:grid;place-items:center;color:#fff;font-size:14px}
.chk.on .box{background:var(--c)}.chk.on .box:after{content:"\2713"}
.chk.on span{text-decoration:line-through;opacity:.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .chk{margin:0;font-size:12px;padding:10px}
.grid .box{border-radius:6px;width:20px;height:20px;font-size:12px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 14px 10px}
.sc label{display:block;font-size:12px;font-weight:700;margin-top:10px}
.sc input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--mute);color:var(--ink);font:14px system-ui;padding:6px 0;outline:0}
.quote{background:var(--pv);color:#fff;border-radius:14px;padding:18px;text-align:center;font-weight:800;margin:16px 0 6px}
.quote small{display:block;font-weight:400;opacity:.85;margin-top:4px;font-size:12px}
.wk{margin-top:10px;background:transparent;border:1px solid var(--c);color:var(--c);border-radius:14px;padding:5px 12px;font:700 11px system-ui}
.ph{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.ph.cur{background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:8px;padding:10px;margin-left:-6px;margin-right:-6px}
.ph .pt{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:700}
.ph .pt span{font-size:11px;color:var(--c);white-space:nowrap}
.ph .pd{font-size:12px;color:var(--mute);margin:2px 0 4px}
.ph ul{margin:4px 0 0;padding-left:18px;font-size:13px}
.warn{font-size:12px;font-weight:700;color:var(--cricket);margin-top:12px}
.bnav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
.bnav button{flex:1;background:none;border:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font:700 10px system-ui;padding:4px 0}
.bnav button.on{color:var(--ink)}
.bnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bnav button.on svg{stroke:var(--pv)}
.pills{display:flex;gap:6px;margin:6px 0 14px}

<script>
const COL={train:"var(--train)",cricket:"var(--cricket)",pv:"var(--pv)",college:"var(--college)",rest:"var(--rest)",free:"var(--free)",gold:"var(--gold)"};
const S={
mf:[["05:45","06:30","Conditioning · 45 min","Sprints, core, and leg strength. Done before the commute drains you.","train"],
["06:30","07:15","Prep & Exit","Shower, high-protein breakfast, grab bag. Leave without delay.","rest"],
["07:15","18:30","Commute & College","THE HACK: Use the 2-hour commute to read ICH guidelines and MedDRA terms. Do college assignments during campus breaks.","college"],
["18:30","19:00","Return & Refuel","Quick snack. Change clothes immediately. No sitting on the couch.","rest"],
["19:00","20:30","Elite Cricket Nets","Pure skill work: pace, accuracy, timing, and power hitting.","cricket"],
["20:30","21:30","PV Laptop Work","Uninterrupted deep work: Argus tutorials, mock case narratives, or PV certification coursework.","pv"],
["21:30","22:30","Free Life + Dinner","Decompress. AI animation, family/girlfriend time, and dinner.","free"],
["22:30","05:45","Sleep · 7h 15m","Mandatory physical shutdown. Protect recovery.","rest"]],
sat:[["06:30","07:30","Wake & Prep","Extra sleep. Solid breakfast. Prepare for competition.","rest"],
["08:00","12:00","Match Day / Trials","Play a competitive local match or attend a trial. Test yourself against strong players, not only friends.","cricket"],
["12:00","14:00","Recovery + Lunch","Hydrate, eat, and physically rest.","rest"],
["14:00","16:30","Deep PV Study","2.5 hours of focused work: complex mock cases and clinical-data study.","pv"],
["16:30","18:00","College Overflow","Finish remaining B.Pharm assignments or study for upcoming exams.","college"],
["18:00","23:59","Total Disconnect","Go out, spend time with loved ones, make lo-fi music, or work on AI webcomics. The night is yours.","free"]],
sun:[["07:00","10:00","Active Recovery","Sleep in slightly. Light stretching or walking. No heavy lifting or intense nets.","train"],
["10:00","13:00","Free Time","Family time, chores, or hobbies.","free"],
["13:00","15:00","Portfolio Building","Format PV CV. Finalize mock case narratives into clean PDFs. Search LinkedIn for remote PV internships/healthcare agencies.","pv"],
["15:00","19:00","Free Time","Complete disconnect.","free"],
["19:00","20:30","The Monday Setup","Pack college bag, lay out morning gym clothes, and download next week's PV materials for the commute.","college"],
["20:30","21:30","Dinner + Wind Down","Relax and get off screens.","rest"],
["21:30","23:59","Early Sleep","Reset your rhythm for the 5:45 AM Monday wake-up.","rest"]]};
const W=[["05:45","05:50","1. Dynamic Warm-Up","5 min · Wake up your central nervous system immediately.",["Jumping Jacks: 60 seconds","High Knees: 60 seconds","Bodyweight Squats: 2 sets of 15 reps"]],
["05:50","06:05","2. Explosive Leg Power","15 min · Build fast-twitch muscle response for hitting and bowling.",["Jump Squats: 4 sets of 12 reps","Alternating Jumping Lunges: 3 sets of 20 reps (10 per leg)","Glute Bridges: 3 sets of 15 reps"]],
["06:05","06:20","3. Core Armor","15 min · Core strength for rotational torque and lower back protection.",["Forearm Plank: 3 sets of 60 seconds","Russian Twists: 3 sets of 30 reps","Leg Raises: 3 sets of 15 reps","Mountain Climbers: 3 sets of 45 seconds"]],
["06:20","06:30","4. Sprint & Stamina Finisher","10 min · Simulate the cardio demand of running between the wickets.",["Burpees: 4 sets of 45 sec on, 15 sec rest","Shadow Sprints (running in place): 3 sets of 30 sec max effort, then 30 sec slow walk"]]];
let openW=false;
const NN=[["Conditioning / recovery","train"],["PV study / portfolio","pv"],["Cricket skill / match exposure","cricket"],["Sleep protected","rest"]];
const SCORE=["Competitive match / trial attended","Batting / skill performance","PV deep-work completed","One weakness identified"];
const LAUNCH=["College bag packed","Training clothes ready","PV videos / PDFs downloaded","CV / portfolio task identified","Monday alarm set","Screens off before sleep"];
const ICON={home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',today:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',plan:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',work:'<svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 9.5v5M21 9.5v5M6 12h12"/></svg>',progress:'<svg viewBox="0 0 24 24"><path d="M5 21V11M12 21V4M19 21v-6"/></svg>',mission:'<svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/></svg>'};
const TABS=[["home","Home"],["today","Today"],["plan","Plan"],["work","Workout"],["progress","Progress"]];
const HEAD={mf:["Mon – Fri: The Grind","Build the career while building the athlete"],sat:["Saturday","The Reality Check: test the skills under pressure"],sun:["Sunday","Recovery & The Setup: repair the body, arm the week"]};

const m=s=>{const[a,b]=s.split(":");return +a*60+ +b};
const f12=s=>{let[h,mi]=s.split(":").map(Number);const ap=h<12?"AM":"PM";return(h%12||12)+":"+String(mi).padStart(2,"0")+" "+ap};
const dur=x=>{x=Math.max(0,Math.round(x));const h=Math.floor(x/60),mi=x%60;return(h?h+"h ":"")+mi+"m"};
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const monday=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return dkey(d)};
const todayKey=()=>{const g=new Date().getDay();return g==6?"sat":g==0?"sun":"mf"};
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let tab="home",plan=todayKey();
function inBlock(b,now){const s=m(b[0]),e=m(b[1]);return s<=e?(now>=s&&now<e):(now>=s||now<e)}
function phases(live){const now=new Date(),nm=now.getHours()*60+now.getMinutes();
 return W.map(p=>`<div class="ph ${live&&nm>=m(p[0])&&nm<m(p[1])?"cur":""}"><div class="pt"><b>${p[2]}</b><span>${f12(p[0])} – ${f12(p[1])}</span></div><div class="pd">${p[3]}</div><ul>${p[4].map(x=>"<li>"+x+"</li>").join("")}</ul></div>`).join("")+`<div class="warn">No cricket bat during this block.</div>`}
function card(b,cls="",idx=-1){const wo=b[2].startsWith("Conditioning"),tick=idx>=0&&!b[2].startsWith("Sleep"),dn=tick&&store.get("tb:"+dkey(new Date()),{})[idx];
 return `<div class="card ${cls} ${tick?"hasTk":""} ${dn?"done":""}" style="--c:${COL[b[4]]}"><div class="t">${f12(b[0])} – ${f12(b[1])}</div><div class="n">${b[2]}</div><div class="d">${b[3]}</div>${wo?`<button class="wk" onclick="openW=!openW;render()">${openW?"Hide workout ▴":"Show workout ▾"}</button>${openW?phases(cls=="now"):""}`:""}${cls=="now"?'<span class="badge">NOW</span>':""}${tick?`<button class="tk ${dn?"on":""}" onclick="tb(${idx})" aria-label="mark done"></button>`:""}</div>`}
function checks(list,key,grid){const st=store.get(key,{});
 return `<div class="${grid?"grid":""}">`+list.map((x,i)=>{const lab=Array.isArray(x)?x[0]:x,c=Array.isArray(x)?COL[x[1]]:"var(--train)";
 return `<button class="chk ${st[i]?"on":""}" style="--c:${c}" onclick="tog('${key}',${i})"><i class="box"></i><span>${lab}</span></button>`}).join("")+`</div>`}
function tog(key,i){const st=store.get(key,{});st[i]=!st[i];store.set(key,st);render()}
function score(){const key="sc:"+monday(),st=store.get(key,{});
 return `<div class="sec" style="color:var(--gold)">SATURDAY SCORECARD</div><div class="sc">`+SCORE.map((s,i)=>`<label>${s}<input value="${(st[i]||"").replace(/"/g,"&quot;")}" oninput="sv('${key}',${i},this.value)"></label>`).join("")+`</div>`}
function sv(key,i,v){const st=store.get(key,{});st[i]=v;store.set(key,st)}
function dayExtras(k){
 if(k=="sat")return score();
 if(k=="sun")return `<div class="sec" style="color:var(--train)">MONDAY LAUNCH CHECKLIST</div>`+checks(LAUNCH,"ln:"+monday(),true)+
  `<div class="sec" style="color:var(--gold)">THE RULE</div><div class="card" style="--c:var(--gold)"><div class="d" style="color:var(--ink)">Miss one block? Resume at the next block. Do not turn one failure into a failed day. Consistency beats heroic bursts.</div></div>`;
 if(k=="mf")return `<div class="card" style="--c:var(--pv)"><div class="n" style="font-size:13px">TRACK A — PV</div><div class="d">B.Pharm › ICH / MedDRA › case-processing skills › portfolio › applications</div></div>
 <div class="card" style="--c:var(--cricket)"><div class="n" style="font-size:13px">TRACK B — CRICKET</div><div class="d">Conditioning › nets › competition › measurable performance</div></div>`;
 return "";}
function heroPhase(nm){const p=W.find(p=>nm>=m(p[0])&&nm<m(p[1]));if(!p)return "";
 return `<div style="margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.35)"><div class="k" style="font-size:11px;font-weight:700;letter-spacing:.06em;opacity:.85">${p[2].toUpperCase()} · ${dur(m(p[1])-nm)} LEFT</div><ul style="margin:6px 0 0;padding-left:18px;font-size:14px">${p[4].map(x=>"<li>"+x+"</li>").join("")}</ul></div>`}
function hero(k){const now=new Date(),nm=now.getHours()*60+now.getMinutes(),sch=S[k];
 const cur=sch.find(b=>inBlock(b,nm));
 if(cur){const s=m(cur[0]);let e=m(cur[1]);let el=nm-s;if(el<0)el+=1440;let tot=e-s;if(tot<=0)tot+=1440;
  const nxt=sch[(sch.indexOf(cur)+1)%sch.length];
  return `<div class="hero" style="--c:${COL[cur[4]]}"><div class="k">NOW · ENDS ${f12(cur[1])}</div><div class="n">${cur[2]}</div><div class="d">${cur[3]}</div><div class="bar"><i style="width:${Math.min(100,el/tot*100)}%"></i></div><div class="meta"><span>${dur(tot-el)} left</span><span>Next: ${nxt[2]}</span></div>${cur[2].startsWith("Conditioning")?heroPhase(nm):""}</div>`}
 const nxt=sch.find(b=>m(b[0])>nm);
 if(nxt)return `<div class="hero" style="--c:var(--rest)"><div class="k">UP NEXT · ${f12(nxt[0])}</div><div class="n">${nxt[2]}</div><div class="d">Starts in ${dur(m(nxt[0])-nm)}. ${nxt[3]}</div></div>`;
 return `<div class="hero" style="--c:var(--rest)"><div class="k">DAY DONE</div><div class="n">Rest up</div><div class="d">Protect your sleep. Tomorrow starts clean.</div></div>`}
function schedule(k,live){const now=new Date(),nm=now.getHours()*60+now.getMinutes();
 return S[k].map((b,i)=>{let cls="";if(live){if(inBlock(b,nm))cls="now";else if(m(b[1])<=nm&&m(b[0])<m(b[1]))cls="past"}return card(b,cls,live?i:-1)}).join("")}
const Q=["Discipline is choosing what you want most over what you want now.","Small blocks, done daily, build big careers.","Show up. Sweat. Study. Repeat.","The scoreboard is built in the morning.","You don't need motivation. You need the next block.","Train like the trial is tomorrow.","Consistency beats heroic bursts.","Be the player they scout and the pharmacist they hire.","One more rep. One more page. One more day.","Your future self is watching this block.","Earn the weekend. Then own it.","Nets today, tournaments tomorrow.","Do the boring work brilliantly.","Progress is quiet. Keep going.","Win the morning, win the day.","Pressure is a privilege. Prepare for it.","Every case narrative sharpens the career.","Rest is part of the plan. So is the next sprint.","Miss a block? Resume at the next one.","Be relentless on the basics.","Strong body. Sharp mind. Clear plan.","Dream big. Schedule it.","Every legend has a training arc.","Power up. Next block.","Limits are just the next level.","Your comeback story starts at dawn.","Believe in the one who trains at 5:45."];
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^(a>>>15),1|a);t=t+Math.imul(t^(t>>>7),61|t)^t;return((t^(t>>>14))>>>0)/4294967296}}
const stars=(r,n,ym)=>Array.from({length:n},()=>`<circle cx="${(r()*390).toFixed(1)}" cy="${(r()*ym).toFixed(1)}" r="${(r()*1.3+.3).toFixed(2)}" fill="#fff" opacity="${(r()*.7+.3).toFixed(2)}"/>`).join("");
const svg=x=>`<svg viewBox="0 0 390 320" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${x}</svg>`;
const BL=(id,s)=>`<filter id="${id}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${s}"/></filter>`;
const WP=[
 r=>svg(`<defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset=".55" stop-color="#be185d"/><stop offset="1" stop-color="#fb923c"/></linearGradient></defs><rect width="390" height="320" fill="url(#a)"/>${stars(r,25,90)}<circle cx="${(200+r()*120).toFixed(0)}" cy="190" r="46" fill="#fde68a" opacity=".95"/><path d="M0 230 C80 190 150 215 230 235 S340 230 390 205 V320 H0Z" fill="#7c2d12" opacity=".78"/><path d="M0 255 C70 235 140 255 210 265 S330 255 390 240 V320 H0Z" fill="#431407" opacity=".92"/><path d="M0 285 C90 270 160 290 250 295 S350 285 390 275 V320 H0Z" fill="#1c0a04"/>`),
 r=>svg(`<defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050816"/><stop offset="1" stop-color="#312e81"/></linearGradient></defs><rect width="390" height="320" fill="url(#a)"/>${stars(r,70,200)}<mask id="mm"><rect width="390" height="320" fill="#fff"/><circle cx="312" cy="70" r="24" fill="#000"/></mask><circle cx="300" cy="78" r="26" fill="#fef9c3" mask="url(#mm)"/><path d="M0 255 L70 175 L120 220 L190 145 L260 225 L320 180 L390 240 V320 H0Z" fill="#1e293b"/><path d="M0 290 L60 240 L130 275 L210 225 L290 280 L350 250 L390 270 V320 H0Z" fill="#0f172a"/>`),
 r=>svg(`<defs>${BL("b",16)}</defs><rect width="390" height="320" fill="#020617"/>${stars(r,55,170)}<g filter="url(#b)"><path d="M-20 140 C80 40 160 190 250 90 S380 60 420 120 L420 190 C330 140 260 230 170 170 S40 230 -20 190Z" fill="#34d399" opacity=".6"/><path d="M-20 100 C70 20 170 120 260 50 S380 40 420 80 L420 130 C330 100 250 170 170 120 S50 160 -20 140Z" fill="#a78bfa" opacity=".55"/><path d="M-20 170 C90 120 170 220 260 150 S370 130 420 160 L420 200 C340 180 250 240 170 205 S40 230 -20 215Z" fill="#22d3ee" opacity=".35"/></g><path d="M0 262 L60 218 L110 246 L180 198 L250 252 L320 218 L390 256 V320 H0Z" fill="#020617"/>`),
 r=>svg(`<defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#312e81"/><stop offset=".6" stop-color="#db2777"/><stop offset="1" stop-color="#fdba74"/></linearGradient><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient><clipPath id="c"><rect width="390" height="200"/></clipPath></defs><rect width="390" height="200" fill="url(#a)"/><circle cx="195" cy="200" r="56" fill="#fff7ed" clip-path="url(#c)" opacity=".95"/><rect y="200" width="390" height="120" fill="url(#s)"/><rect x="150" y="207" width="90" height="3" rx="1.5" fill="#fff7ed" opacity=".7"/><rect x="165" y="218" width="60" height="3" rx="1.5" fill="#fff7ed" opacity=".55"/><rect x="175" y="230" width="40" height="3" rx="1.5" fill="#fff7ed" opacity=".4"/><rect x="183" y="243" width="24" height="3" rx="1.5" fill="#fff7ed" opacity=".3"/><path d="M0 262 Q50 254 100 262 T200 262 T300 262 T400 262" stroke="#fff" stroke-opacity=".18" fill="none" stroke-width="2"/><path d="M0 288 Q50 280 100 288 T200 288 T300 288 T400 288" stroke="#fff" stroke-opacity=".12" fill="none" stroke-width="2"/>`),
 r=>svg(`<defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f0a2a"/><stop offset="1" stop-color="#5b21b6"/></linearGradient><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#ec4899"/></linearGradient><clipPath id="c"><rect width="390" height="200"/></clipPath></defs><rect width="390" height="320" fill="url(#a)"/>${stars(r,30,120)}<circle cx="195" cy="165" r="72" fill="url(#s)" clip-path="url(#c)"/><rect x="110" y="168" width="170" height="3" fill="#3b1a7a"/><rect x="110" y="178" width="170" height="4" fill="#3b1a7a"/><rect x="110" y="189" width="170" height="6" fill="#3b1a7a"/><rect y="200" width="390" height="120" fill="#12082e"/><g stroke="#f0abfc" stroke-opacity=".6" stroke-width="1.2"><path d="M0 206H390M0 216H390M0 232H390M0 256H390M0 292H390"/>${[-300,-200,-120,-60,0,60,120,180,195,210,270,330,390,450,510,590,690].map(x=>`<path d="M195 200L${x} 320"/>`).join("")}</g>`),
 r=>svg(`<rect width="390" height="320" fill="#0b1120"/>${stars(r,30,320)}<circle cx="150" cy="150" r="115" fill="#2563eb" opacity=".65" style="mix-blend-mode:screen"/><circle cx="250" cy="175" r="105" fill="#ea580c" opacity=".65" style="mix-blend-mode:screen"/><circle cx="200" cy="160" r="150" fill="none" stroke="#fff" stroke-opacity=".12"/><circle cx="200" cy="160" r="95" fill="none" stroke="#fff" stroke-opacity=".1"/>`),
 r=>svg(`<defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset=".6" stop-color="#115e59"/><stop offset="1" stop-color="#5eead4"/></linearGradient>${BL("b",14)}</defs><rect width="390" height="320" fill="url(#a)"/><circle cx="285" cy="110" r="34" fill="#ccfbf1" opacity=".85"/><path d="M0 230 L80 150 L150 215 L230 130 L310 220 L390 165 V320 H0Z" fill="#134e4a" opacity=".55"/><ellipse cx="200" cy="230" rx="260" ry="26" fill="#fff" opacity=".18" filter="url(#b)"/><path d="M0 262 L70 205 L140 255 L220 190 L300 258 L390 210 V320 H0Z" fill="#0f3d3a" opacity=".78"/><path d="M0 300 L90 255 L180 292 L270 250 L390 290 V320 H0Z" fill="#082a2b"/>`),
 r=>svg(`<defs>${BL("b",34)}</defs><rect width="390" height="320" fill="#0b1020"/><g filter="url(#b)">${["#6366f1","#ec4899","#f59e0b","#14b8a6","#3b82f6"].map(c=>`<circle cx="${(r()*390).toFixed(0)}" cy="${(r()*320).toFixed(0)}" r="${(70+r()*50).toFixed(0)}" fill="${c}" opacity=".6"/>`).join("")}</g>${stars(r,20,320)}`)
];

const fig=(x,y,s,c="#0a0d1c")=>`<g transform="translate(${x} ${y}) scale(${s})" fill="${c}" stroke="${c}" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-93" r="7" stroke="none"/><path d="M-7 -97 L-5 -108 L0 -100 L3 -111 L7 -97Z" stroke="none"/><path d="M-4 -86 Q-24 -93 -40 -80 Q-24 -82 -7 -77Z" stroke="none" opacity=".9"/><path d="M-9 -85 L9 -85 L8 -48 L-8 -48Z" stroke="none"/><path d="M-8 -50 L-14 0 L-5 0 L0 -32 L6 0 L15 0 L8 -50Z" stroke="none"/><path d="M-7 -80 L13 -64 M8 -80 L14 -64" fill="none" stroke-width="5"/><path d="M14 -64 L36 -104" fill="none" stroke-width="5"/><path d="M33 -99 L40 -111" fill="none" stroke-width="10"/></g>`;
const cloud=(x,y,s,f,o)=>`<g transform="translate(${x} ${y}) scale(${s})" fill="${f}" opacity="${o}"><ellipse cx="0" cy="0" rx="46" ry="13"/><ellipse cx="28" cy="-9" rx="30" ry="16"/><ellipse cx="-24" cy="-7" rx="26" ry="12"/><ellipse cx="6" cy="-14" rx="22" ry="14"/></g>`;
const petals=(r,n,c)=>Array.from({length:n},()=>{const x=r()*390,y=r()*320,ro=r()*180;return `<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${(2+r()*2.2).toFixed(1)}" ry="${(1.2+r()*1.2).toFixed(1)}" transform="rotate(${ro.toFixed(0)} ${x.toFixed(0)} ${y.toFixed(0)})" fill="${c}" opacity="${(.5+r()*.5).toFixed(2)}"/>`}).join("");
const skyline=(r,y,c)=>{let x=-5,o="";while(x<400){const w=12+r()*18,h=16+r()*50;o+=`<rect x="${x.toFixed(0)}" y="${(y-h).toFixed(0)}" width="${w.toFixed(0)}" height="${(h+40).toFixed(0)}" fill="${c}"/>`;x+=w+1+r()*3}return o};

 el.classList.add("show");if(!NATIVE&&SET.vib!==false){try{navigator.vibrate&&navigator.vibrate(vibPattern())}catch(e){}}clearTimeout(window._tt);window._tt=setTimeout(hideToast,15000)}

function tickAlerts(){if(!SET.on)return;const now=new Date(),dow=now.getDay()+1,nm=now.getHours()*60+now.getMinutes(),fk="fired:"+dkey(now),fired=store.get(fk,{});
 buildAlerts().forEach(a=>{if(!a.d.includes(dow))return;const am=a.h*60+a.m;if(nm>=am&&nm-am<=2&&!fired[a.id]){fired[a.id]=1;store.set(fk,fired);fireAlert(a)}})}

 toast(a);if(NATIVE){try{NB.testAlert()}catch(e){}}else webNotify(a);refreshSheet()}

function icsEsc(s){return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n")}
function icsFold(l){let o="";while(l.length>73){o+=l.slice(0,73)+"\r\n ";l=l.slice(73)}return o+l}
function makeICS(){const G=[["mf",[1,2,3,4,5],"MO,TU,WE,TH,FR"],["sat",[6],"SA"],["sun",[0],"SU"]];
 const ds=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
 const ts=(d,mins)=>ds(d)+"T"+pad(Math.floor(mins/60))+pad(mins%60)+"00";
 const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Dual-Track//EN","CALSCALE:GREGORIAN"];let n=0;
 G.forEach(([k,dows,by])=>{const d0=new Date();while(!dows.includes(d0.getDay()))d0.setDate(d0.getDate()+1);
  S[k].forEach(b=>{const cat=(b[4]=="free"||b[4]=="rest")?"rest":b[4];if(!SET.cat[cat])return;
   const s=m(b[0]),e=m(b[1]),d1=new Date(d0);if(e<=s)d1.setDate(d1.getDate()+1);
   L.push("BEGIN:VEVENT","UID:dt-"+(++n)+"@dualtrack","DTSTAMP:"+ds(new Date())+"T000000Z","DTSTART:"+ts(d0,s),"DTEND:"+ts(d1,e),
    "RRULE:FREQ=WEEKLY;BYDAY="+by,"SUMMARY:"+icsEsc(b[2]),"DESCRIPTION:"+icsEsc(b[3]),
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(b[2]),"TRIGGER:-PT"+SET.lead+"M","END:VALARM","END:VEVENT")})});
 L.push("END:VCALENDAR");return L.map(icsFold).join("\r\n")+"\r\n"}
function dlICS(){const b=new Blob([makeICS()],{type:"text/calendar"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="Dual-Track-Reminders.ics";document.body.appendChild(a);a.click();a.remove()}
function renderSheet(){const ps=permState();
 const status=NATIVE?(ps=="granted"?"Allowed on this phone":"Allow notifications when asked"):ps=="granted"?"Allowed":ps=="denied"?"Blocked in browser settings (in-app alerts still work)":ps=="unsupported"?"Not supported here (in-app alerts only)":"Not asked yet";
 const cats=[["train","Workout","var(--train)"],["cricket","Cricket nets & matches","var(--cricket)"],["pv","PV study & portfolio","var(--pv)"],["college","College & assignments","var(--college)"],["rest","Free time, wind-down & sleep","var(--rest)"]];
 return `<div class="sheet-bg" onclick="closeSettings()"></div><div class="sheet"><div class="grab"></div><div class="sh-h"><b>Settings</b><button class="x" onclick="closeSettings()">Done</button></div>
 <div class="sec">HOME WALLPAPER</div>
 <div class="thumbs">${CUSTOM.map((u,i)=>`<div class="th ${SET.useMine&&SET.pick==i?"on":""}" style="background-image:url('${u}')" onclick="pickWp(${i})"><button class="rm" onclick="event.stopPropagation();delWp(${i})" aria-label="remove">✕</button></div>`).join("")}${CUSTOM.length<6?`<button class="th add" onclick="document.getElementById('wpfile').click()">+<small>Add photo</small></button>`:""}</div>
 <div class="row"><div>Use my photo on Home<small>${CUSTOM.length?"Tap a photo above to choose it (↻ on Home cycles them)":"Add your own picture, e.g. your favourite art"}</small></div><button class="sw ${SET.useMine?"on":""}" onclick="toggleMine()" aria-label="use my photo"><i></i></button></div>
 <div class="seg" style="margin-bottom:8px">${[["top","Focus top"],["center","Focus center"],["bottom","Focus bottom"]].map(([v,l])=>`<button class="${SET.pos==v?"on":""}" onclick="setSeg('pos','${v}')">${l}</button>`).join("")}</div>
 <div class="seg" style="margin-bottom:8px">${[[0,"Light shade"],[1,"Medium shade"],[2,"Strong shade"]].map(([v,l])=>`<button class="${(SET.shade??1)==v?"on":""}" onclick="setSeg('shade',${v})">${l}</button>`).join("")}</div>
 <div class="row"><div>Show quote on wallpaper</div><button class="sw ${SET.quote!==false?"on":""}" onclick="setSeg('quote',${SET.quote===false})" aria-label="show quote"><i></i></button></div>
 <div class="sec">ALERTS</div><div class="row"><div><b>Task reminders</b><small>${status}</small></div><button class="sw ${SET.on?"on":""}" onclick="toggleNotif()" aria-label="toggle reminders"><i></i></button></div>
 ${CAPONLY?`<p class="fine" style="margin:6px 2px 12px">Vibration and sound follow your phone's notification settings for this app.</p>`:`<div class="sec">ALERT STYLE</div><div class="row"><div>Strong vibration<small>Buzzes about 20 seconds like an alarm until you tap Done</small></div><button class="sw ${SET.vib?"on":""}" onclick="setOpt('vib')" aria-label="strong vibration"><i></i></button></div>${NATIVE?`<div class="row"><div>Alarm sound<small>Plays your alarm tone until you dismiss it</small></div><button class="sw ${SET.snd?"on":""}" onclick="setOpt('snd')" aria-label="alarm sound"><i></i></button></div>`:""}`}<div class="sec">WHEN</div><div class="seg">${[[0,"At start"],[5,"5 min before"],[10,"10 min before"]].map(([v,l])=>`<button class="${SET.lead==v?"on":""}" onclick="setLead(${v})">${l}</button>`).join("")}</div>
 <div class="sec">REMIND ME ABOUT</div>${cats.map(([k,l,c])=>`<div class="row"><div><b style="color:${c}">●</b> ${l}</div><button class="sw ${SET.cat[k]?"on":""}" onclick="setCat('${k}')" aria-label="${l}"><i></i></button></div>`).join("")}
 ${NATIVE?"":`<div class="sec">WORKS WHEN APP IS CLOSED</div><button class="big" onclick="dlICS()">Add reminders to phone calendar (.ics)</button><p class="fine">Opens your calendar app, then tap Add / Import. Your phone's calendar fires the alarms even when this app is closed. Uses the timing and categories chosen above. After changing them, delete the old events and import again.</p>`}<div class="sec">TEST</div><button class="big" onclick="testAlert()">Send test alert</button>${NATIVE&&!NB.canExact()?`<button class="big" onclick="NB.openExactSettings()">Allow exact alarm timing</button>`:""}
 <p class="fine">${NATIVE?"Reminders are scheduled on your phone, so they arrive even when the app is closed. Each one buzzes like an alarm until you tap Done or Snooze.":"In-app alerts show while this app is open or running in the background. A fully closed web app can't be woken on a schedule, so use the calendar option above, or the Android app build."}</p></div>`}

let pvMode="week",wOff=0,mOff=0;
const dowKey=d=>{const g=d.getDay();return g==6?"sat":g==0?"sun":"mf"};
function dayStats(d){const ids=taskIds(dowKey(d)),st=store.get("tb:"+dkey(d),{}),done=ids.filter(i=>st[i]).length;return{done,total:ids.length,pct:ids.length?Math.round(done/ids.length*100):0}}
const exCount=d=>Object.values(store.get("wx:"+dkey(d),{})).filter(Boolean).length;
const inRange=d=>{const k=dkey(d);return k>=FIRST&&k<=dkey(new Date())};
function agg(dates){let done=0,total=0,perfect=0,active=0,nn=0,ex=0,days=0,best=null;
 dates.forEach(d=>{if(!inRange(d))return;const s=dayStats(d);days++;done+=s.done;total+=s.total;if(s.pct==100)perfect++;if(s.done>0)active++;nn+=nnDone(dkey(d));ex+=exCount(d);if(!best||s.pct>best.pct)best={d,pct:s.pct}});
 return{done,total,pct:total?Math.round(done/total*100):0,perfect,active,nn,ex,days,best}}
const heatCol=p=>p>=100?"var(--train)":p>=70?"#4ade80":p>=40?"#eab308":p>0?"var(--cricket)":"transparent";
const heatTxt=p=>(p>=100||p<40)?"#fff":"#0b1120";
const fmt=(d,o)=>d.toLocaleDateString(undefined,o);
function weekDays(off){const mon=new Date();mon.setHours(0,0,0,0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7)+off*7);return[0,1,2,3,4,5,6].map(i=>{const x=new Date(mon);x.setDate(mon.getDate()+i);return x})}
function ringHTML(pct,title,l1,l2){const C=213.63;return `<div class="prog"><svg class="ring" viewBox="0 0 80 80"><circle class="rbg" cx="40" cy="40" r="34"/><circle class="rfg" cx="40" cy="40" r="34" transform="rotate(-90 40 40)" style="stroke-dasharray:${(C*pct/100).toFixed(1)} ${C}"/><text x="40" y="46" text-anchor="middle">${pct}%</text></svg><div><b>${title}</b><span>${l1}</span><small>${l2}</small></div></div>`}
const statRow=(a,b)=>`<div class="stat"><div><b>${a[0]}</b><span>${a[1]}</span></div><div><b>${b[0]}</b><span>${b[1]}</span></div></div>`;
const setPv=v=>{pvMode=v;render()};
const shiftW=d=>{wOff=Math.min(0,wOff+d);render()};
const shiftM=d=>{mOff=Math.min(0,mOff+d);render()};
function progressView(){const td=dkey(new Date());
 let h=`<h1>Progress</h1><div class="sub">Tracking since ${fmt(new Date(FIRST+"T00:00:00"),{day:"numeric",month:"short"})}</div><div class="pills"><button class="${pvMode=="week"?"on":""}" onclick="setPv('week')">WEEK</button><button class="${pvMode=="month"?"on":""}" onclick="setPv('month')">MONTH</button></div>`;
 if(pvMode=="week"){const days=weekDays(wOff),a=agg(days);
  h+=`<div class="pnav"><button onclick="shiftW(-1)">‹</button><b>${wOff==0?"This week":wOff==-1?"Last week":"Week"} · ${fmt(days[0],{month:"short",day:"numeric"})} – ${fmt(days[6],{month:"short",day:"numeric"})}</b><button ${wOff==0?"disabled":""} onclick="shiftW(1)">›</button></div>`+
  ringHTML(a.pct,"Weekly progress",`${a.done} of ${a.total} tasks completed`,a.days?`${a.days} day${a.days>1?"s":""} tracked`+(a.best?` · best ${fmt(a.best.d,{weekday:"short"})} ${a.best.pct}%`:""):"No tracked days yet")+
  `<div class="sec">DAILY BREAKDOWN</div><div class="bars">`+days.map((d,i)=>{const k=dkey(d),ok=inRange(d),s=dayStats(d);
   return `<div class="bc ${k==td?"today":""} ${k>td?"fut":""}"><span>${ok?s.pct+"%":"–"}</span><div class="bt"><div class="bf" style="height:${ok?s.pct:0}%;--h:${heatCol(s.pct)}"></div></div><i>${"MTWTFSS"[i]}</i><em>${d.getDate()}</em></div>`}).join("")+`</div>`+
  `<div class="sec">THIS WEEK IN NUMBERS</div>`+statRow([a.perfect,"Perfect days"],[a.active,"Active days"])+statRow([a.nn+"/"+(a.days*NN.length),"Daily check-ins"],[a.ex,"Workout exercises ticked"]);}
 else{const now=new Date(),f=new Date(now.getFullYear(),now.getMonth()+mOff,1),n=new Date(f.getFullYear(),f.getMonth()+1,0).getDate(),
  days=Array.from({length:n},(_,i)=>new Date(f.getFullYear(),f.getMonth(),i+1)),a=agg(days),lead=(f.getDay()+6)%7;
  h+=`<div class="pnav"><button onclick="shiftM(-1)">‹</button><b>${fmt(f,{month:"long",year:"numeric"})}</b><button ${mOff==0?"disabled":""} onclick="shiftM(1)">›</button></div>`+
  ringHTML(a.pct,"Monthly progress",`${a.done} of ${a.total} tasks completed`,a.days?`${a.days} day${a.days>1?"s":""} tracked`:"No tracked days yet")+
  `<div class="sec">CALENDAR</div><div class="cal">`+"MTWTFSS".split("").map(x=>`<div class="dow">${x}</div>`).join("")+Array(lead).fill("<div></div>").join("")+
  days.map(d=>{const k=dkey(d),ok=inRange(d),s=dayStats(d),has=ok&&s.pct>0;return `<div class="mc ${has?"h":""} ${k==td?"today":""} ${k>td?"fut":""}" style="--h:${heatCol(s.pct)};--t:${heatTxt(s.pct)}"><b>${d.getDate()}</b>${has?`<small>${s.pct}%</small>`:""}</div>`}).join("")+`</div>`+
  `<div class="leg"><span style="--h:var(--cricket)"></span>1–39%<span style="--h:#eab308"></span>40–69%<span style="--h:#4ade80"></span>70–99%<span style="--h:var(--train)"></span>100%</div>`+
  `<div class="sec">THIS MONTH IN NUMBERS</div>`+statRow([a.perfect,"Perfect days"],[a.active,"Active days"])+statRow([a.nn+"/"+(a.days*NN.length),"Daily check-ins"],[a.ex,"Workout exercises ticked"]);}
 return h}
function go(k){tab=k;render();scrollTo(0,0)}
render();setInterval(()=>{if(!document.activeElement||document.activeElement.tagName!="INPUT")render()},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){render();tickAlerts();syncNative();refreshSheet();capRefresh()}});
setInterval(tickAlerts,15000);tickAlerts();syncNative();capRefresh();

// offline cache

</script>
</body>
